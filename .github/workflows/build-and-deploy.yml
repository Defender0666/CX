name: Build Android APK and publish web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: career-os-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flet_app/requirements.txt
      - name: Install Flet
        run: python -m pip install -r flet_app/requirements.txt
      - name: Build release APK
        run: flet build apk flet_app --yes --no-rich-output --python-version 3.12
      - name: Stage APK
        run: |
          mkdir -p artifacts
          find flet_app/build -type f -name '*.apk' -print -quit | grep -q . || {
            echo "Flet build completed without producing an APK." >&2
            exit 1
          }
          find flet_app/build -type f -name '*.apk' -print -quit | xargs -I '{}' cp '{}' artifacts/Career-OS-Ultimate.apk
      - name: Publish rolling APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload android-latest artifacts/Career-OS-Ultimate.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create android-latest artifacts/Career-OS-Ultimate.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Latest Android APK" \
              --notes "Automatically built from the latest successful push to main. Unsigned for Play Store distribution; install only if you trust this project." \
              --prerelease
          fi

  web:
    name: Build and publish GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: flet_app/requirements.txt
      - name: Install Flet
        run: python -m pip install -r flet_app/requirements.txt
      - name: Build static web app
        run: flet publish flet_app/main.py --base-url /CX/ --distpath dist
      - name: Publish static site to Pages branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          JSON
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" --input - <<'JSON'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          JSON
          fi
          gh auth setup-git
          git -C dist init
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add --all
          git -C dist commit -m "Deploy Career OS website"
          git -C dist push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
